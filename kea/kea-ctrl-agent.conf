// Kea Control Agent — kept purely for operator diagnostics (kea-shell,
// lease4-get-all, config-get, etc.). Drawbridge itself never calls this;
// the provisioning gate lives in the ZTP script's phone-home call to
// Drawbridge, not in anything Kea-side. Loopback only — not exposed
// externally. See docs/kea.md.
{
  "Control-agent": {
    // Same local-syslog forwarding as kea-dhcp4.conf, for parity — this
    // process is diagnostics-only and rarely logs anything interesting,
    // but a config-get/lease4-get-all error via kea-shell is still worth
    // having in Drawbridge's log view. See docs/logging.md.
    "loggers": [
      {
        "name": "kea-ctrl-agent",
        "output_options": [
          {
            "output": "syslog:local0"
          }
        ],
        "severity": "INFO"
      }
    ],
    "http-host": "127.0.0.1",
    "http-port": 8081,
    "control-sockets": {
      "dhcp4": {
        "socket-type": "unix",
        "socket-name": "/run/kea/kea4-ctrl-socket"
      }
    }
  }
}
