// Kea DHCPv4 config for the Drawbridge provisioning VLAN. No
// hooks-libraries, no host reservations — the allow/deny gate lives in the
// ZTP script itself (it phones home to Drawbridge with its own serial
// before doing anything real), not here. See docs/decisions.md.
//
// Client classification on Option 60 (vendor-class-identifier) restricts
// the pool to Cisco/Juniper and, more importantly, lets each vendor get its
// own DHCP options — Cisco IOS-XE and Juniper Junos ZTP boot differently
// (different option numbers/semantics for where to fetch a boot
// script/config from), so one global option-data block can't serve both.
// Alpha only implements the Cisco path (scripts/ztp-base.py, IOS-XE
// Guestshell); juniper-devices is defined so the pool admits Junos gear
// already, but has no option-data yet — add it here (as a per-class
// option-data block, same pattern as cisco-devices below) once Juniper ZTP
// support is built. Prefix strings are a starting-point heuristic — verify
// against real device traffic (`tcpdump port 67`, or Kea's own
// DHCP4_PACKET_CLASSIFIED debug log) and adjust; actual Option 60 content
// varies by platform/software version. See docs/kea.md.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["eth1"]
    },
    "lease-database": {
      "type": "memfile"
    },
    "valid-lifetime": 3600,
    "renew-timer": 1800,
    "rebind-timer": 3150,
    "client-classes": [
      {
        "name": "cisco-devices",
        "test": "substring(option[60].text, 0, 5) == 'Cisco' or substring(option[60].text, 0, 5) == 'cisco'",
        "option-data": [
          {
            // Static — not read from DRAWBRIDGE_PORT (see docs/deployment.md).
            // Update this by hand, along with scripts/ztp-base.py's own
            // DRAWBRIDGE_PORT constant, if the server's port ever changes
            // from the default. See docs/decisions.md.
            "name": "boot-file-name",
            "data": "http://192.168.100.1:8080/scripts/ztp-base.py"
          }
        ]
      },
      {
        "name": "juniper-devices",
        "test": "substring(option[60].text, 0, 7) == 'Juniper' or substring(option[60].text, 0, 7) == 'juniper'"
        // No option-data yet — Junos ZTP support is future work, out of
        // scope for alpha. Admitted to the pool already so that work is
        // additive (just add an option-data block here) rather than
        // needing a subnet/pool change too.
      },
      {
        "name": "known-network-vendor",
        "test": "member('cisco-devices') or member('juniper-devices')"
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.100.0/24",
        "pools": [
          {
            "pool": "192.168.100.10 - 192.168.100.200",
            "client-classes": ["known-network-vendor"]
          }
        ]
      }
    ]
  }
}
