// Vanilla Kea DHCPv4 config for the Drawbridge provisioning VLAN. No
// hooks-libraries, no client classification, no hosts-database — every
// client gets a normal lease and the same Option 67 pointer at the ZTP
// script. The allow/deny gate lives in the script itself (it phones home
// to Drawbridge with its own serial before doing anything real), not here.
// See docs/kea.md and docs/decisions.md.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["eth1"]
    },
    "lease-database": {
      "type": "memfile"
    },
    "valid-lifetime": 3600,
    "renew-timer": 1800,
    "rebind-timer": 3150,
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.100.0/24",
        "pools": [
          { "pool": "192.168.100.10 - 192.168.100.200" }
        ],
        "option-data": [
          {
            "name": "boot-file-name",
            "data": "http://192.168.100.1:8080/scripts/ztp-base.py"
          }
        ]
      }
    ]
  }
}
