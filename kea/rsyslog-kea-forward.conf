# Forwards Kea's own DHCP server logs (lease grants, config errors — not
# device-authored content) from the host's local syslog into the
# drawbridge-rsyslog container's second listener, :10515. Installed by
# install.sh to /etc/rsyslog.d/ (same pattern as kea/*.conf going to
# /etc/kea/), separate from device syslog on :10514 and
# container/rsyslog-drawbridge.conf — see docs/logging.md for why these two
# streams are kept apart end to end rather than sharing one listener.
#
# kea/kea-dhcp4.conf and kea/kea-ctrl-agent.conf both log to local0 via
# their "loggers" blocks ("output": "syslog:local0") specifically so this
# rule can select just those lines by facility, without needing to match on
# programname or risk picking up unrelated local0 traffic from other
# software on the same host.
#
# @@ (TCP, not UDP) matches drawbridge-rsyslog's imtcp listener on :10515 —
# same reliability posture as the existing device-syslog forward target.
# Deliberately no "stop" after this — local0 lines still fall through to
# the host's normal default logging too (e.g. /var/log/syslog), so
# journalctl/tcpdump-free local debugging still works even if the pod isn't
# up; this rule only adds a copy into Drawbridge, it doesn't redirect.
local0.* @@127.0.0.1:10515
