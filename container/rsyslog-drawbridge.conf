global(workDirectory="/tmp")

module(load="imudp")
module(load="imtcp")
module(load="omhttp")

input(type="imudp" port="10514")
input(type="imtcp" port="10514")
# Kea's own DHCP server logs (lease grants, errors — not device-authored
# content), forwarded here by kea/rsyslog-kea-forward.conf on the host. A
# separate port/pipeline from device syslog above, not a programname branch
# on the same input: the two sources have no correlation in common (no
# serial/IP to match a ProvisioningSession against), so keeping them apart
# end to end avoids adding per-source branching logic to this file — see
# docs/logging.md. TCP only; the host-side forwarder uses @@ (TCP).
input(type="imtcp" port="10515" ruleset="kealogs")

# omfile to /dev/stdout, not omstdout: the latter is rsyslog's own testbench
# tool, explicitly documented as not meant for real deployments. Purely for
# visibility via `podman logs drawbridge-rsyslog` — the omhttp action below
# is what actually gets each line into Drawbridge.
template(name="console" type="string"
         string="%timestamp:::date-rfc3339% %fromhost-ip% %msg%\n")
action(type="omfile" file="/dev/stdout" template="console")

# option.jsonf="on" + property(...format="jsonf") properly escapes arbitrary
# %msg% content (quotes/backslashes/unicode) instead of hand-rolled string
# concatenation. No per-vendor branching here — see drawbridge/device_events.py
# for where vendor-specific parsing actually lives (docs/logging.md,
# "Multi-vendor").
template(name="deviceLogBody" type="list" option.jsonf="on") {
    property(outname="ip" name="fromhost-ip" format="jsonf")
    property(outname="message" name="msg" format="jsonf")
}
# allowunsignedcerts="on" (curl's CURLOPT_SSL_VERIFYPEER=0) skips CA-chain
# validation entirely, so nothing needs to open/read Drawbridge's cert file
# — rsyslog's own docs call this "strongly discouraged... primarily useful
# only for debugging or testing", which holds for a real network path, but
# this connection never leaves the pod's shared loopback network namespace:
# there's no position an attacker could occupy to MITM it. Hostname
# verification stays on (the default — not disabled via skipverifyhost),
# checked against the cert's SAN (drawbridge/tls.py) using only what's
# received over the connection itself, no local file needed either way.
action(type="omhttp" name="device-logs" server="127.0.0.1" serverport="8080"
    usehttps="on" allowunsignedcerts="on"
    restpath="api/v1/device-logs" template="deviceLogBody"
    action.resumeretrycount="-1")

# Kea logs, on their own ruleset (bound to the :10515 input above) so they
# never touch the device-logs template/action pair. No "ip" property here —
# unlike device syslog, there's no ProvisioningSession to correlate a Kea
# log line to (see docs/logging.md).
template(name="keaLogBody" type="list" option.jsonf="on") {
    property(outname="message" name="msg" format="jsonf")
}
ruleset(name="kealogs") {
    action(type="omfile" file="/dev/stdout" template="console")
    action(type="omhttp" name="kea-logs" server="127.0.0.1" serverport="8080"
        usehttps="on" allowunsignedcerts="on"
        restpath="api/v1/kea-logs" template="keaLogBody"
        action.resumeretrycount="-1")
}
