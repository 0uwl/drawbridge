# Sibling config to container/rsyslog-drawbridge.conf — same "static,
# hardcoded values, no templating" posture (see docs/decisions.md,
# "hardcoded 8080s"). Runs as non-root UID 1000 (Containerfile.nginx), so
# no `user` directive here — that's only meaningful when nginx's master
# starts as root and drops privilege; this master never has privilege to
# drop in the first place.
#
# nginx-mod-stream (Containerfile.nginx) ships the stream module as a
# dynamic .so, not compiled in — must be explicitly loaded before it can
# be used below. Absolute path, not the relative "modules/..." Alpine's own
# snippet (/etc/nginx/modules/10_stream.conf) uses — that resolves via
# /var/lib/nginx/modules, a symlink through a directory owned root:nginx
# mode 750 that this image's non-root UID can't traverse; /usr/lib/nginx/modules
# (what that symlink points at) is plain root:root 755, reachable directly.
load_module "/usr/lib/nginx/modules/ngx_stream_module.so";

worker_processes 1;
# /tmp, not /run or /var/lib/nginx: Alpine's nginx package pre-creates
# those with permissions for its own package-created "nginx" system user
# (root:nginx, some paths mode 750/700), not this image's non-root
# nginx-drawbridge (UID 1000, see Containerfile.nginx) — and those
# permissions survive onto a tmpfs mount by default (Podman's tmpcopyup).
# /tmp sidesteps that entirely: quadlet/drawbridge-nginx.container mounts
# it fresh (Tmpfs=/tmp), same pattern drawbridge.container already uses
# for Gunicorn's own control socket.
pid /tmp/nginx.pid;
# stdout/stderr, not a log file — visibility via `podman logs
# drawbridge-nginx`, same posture as Containerfile.rsyslog's console
# template.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

# ZTP script serving (DHCP Option 67's boot-file-name fetch) is deliberately
# NOT handled here — it stays the separate drawbridge-bootstrap container
# (Containerfile.bootstrap), even though nginx could easily serve a static
# file too. That's core, non-optional functionality; this container (TLS
# termination) is meant to be skippable by an operator bringing their own
# reverse proxy. Folding the two together would mean disabling the
# optional one silently breaks the required one. See v0-3-2.md.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # /dev/stdout, not a log file — same `podman logs drawbridge-nginx`
    # visibility posture as error_log below.
    access_log /dev/stdout;
    # See the /tmp comment near `pid` above — same reasoning, applies to
    # nginx's own temp buffers. client_body/proxy are the two actually used
    # here (proxied POST/PUT bodies, Drawbridge's API takes both); fastcgi/
    # uwsgi/scgi are never invoked by anything in this config, but nginx
    # still tries to create their default temp dirs unconditionally at
    # startup regardless — set explicitly rather than let that fail too.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Reached only via the stream{} router below, never published
    # directly — this is what a plaintext HTTP request against :8080
    # actually gets instead of a TLS handshake failure.
    server {
        listen 127.0.0.1:8082 proxy_protocol;
        # See the matching lines on the 8081 server below for why both of
        # these are required, not just `proxy_protocol` on `listen` alone.
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        default_type text/plain;
        location / {
            return 200 "Drawbridge requires HTTPS. Connect using https://$host:8080/ instead of http://.\n";
        }
    }

    # Reached only via the stream{} router below. Terminates TLS with
    # Drawbridge's own cert/key (drawbridge/tls.py, bind-mounted read-only
    # from the same host path drawbridge.container writes to) and proxies
    # everything — API and frontend alike — to Gunicorn's internal-only
    # plain-HTTP listener. proxy_set_header X-Forwarded-For is load-bearing,
    # not cosmetic: drawbridge/main.py's ProxyFix trusts it to recover the
    # real device/admin IP that request.remote_addr would otherwise lose
    # to nginx's own loopback address — see docs/decisions.md and
    # drawbridge/api/leases.py's IP-pinned session model.
    #
    # proxy_protocol on `listen`, not just cosmetic either: the stream{}
    # block's own proxy_pass below opens a brand-new TCP connection from
    # nginx itself to 127.0.0.1, so without PROXY protocol carrying the
    # real client address across that hop, $remote_addr (and therefore
    # $proxy_add_x_forwarded_for above) would be nginx's own loopback
    # address here regardless — the X-Forwarded-For header would faithfully
    # forward the wrong IP. stream{}'s matching `proxy_protocol on;` is
    # what actually sends it.
    #
    # `listen ... proxy_protocol` alone only parses the header into
    # $proxy_protocol_addr — confirmed directly (raw PROXY-protocol test
    # against this exact listener) that it does NOT touch $remote_addr on
    # its own, so $proxy_add_x_forwarded_for above would stay wrong without
    # these two lines. set_real_ip_from scopes trust to exactly the one
    # peer that can ever reach this loopback-only, unpublished listener
    # (nginx itself, via the stream{} hop above) — nothing external can
    # forge this address in the first place.
    server {
        listen 127.0.0.1:8081 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        ssl_certificate /app/data/tls/cert.pem;
        ssl_certificate_key /app/data/tls/key.pem;

        location / {
            proxy_pass http://127.0.0.1:8078;
            # $http_host, not $host: $host silently drops the port from
            # the client's original Host header, which would make Flask's
            # own absolute-URL generation (url_for(_external=True), SAML's
            # ACS/entity-ID URLs) wrong for anyone connecting on a
            # non-default port.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

# The only :8080 listener that's actually published — everything else
# above is reached through this router, never directly. ssl_preread lets
# nginx look at a connection's first bytes and tell whether they parse as
# a genuine TLS ClientHello before deciding where to send it, without
# terminating TLS itself at this layer. $ssl_preread_protocol comes back
# empty when the bytes don't parse as one at all (e.g. plaintext
# "GET / HTTP/1.1..." — an admin who typed http:// by mistake), which is
# exactly the discriminator needed: real TLS goes to the app; anything
# else gets a clean, readable answer instead of a connection reset. See
# docs/decisions.md and v0-3-2.md.
stream {
    map $ssl_preread_protocol $backend {
        "" plaintext_responder;
        default https_terminator;
    }

    upstream https_terminator {
        server 127.0.0.1:8081;
    }

    upstream plaintext_responder {
        server 127.0.0.1:8082;
    }

    server {
        listen 8080;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $backend;
    }
}
