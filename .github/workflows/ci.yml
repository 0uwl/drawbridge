name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Anything under docs/ (or other pure-prose files) falls into neither
      # filter, so a docs-only PR skips test/frontend/publish entirely below.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'drawbridge/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'Containerfile'
              - 'container/**'
              - 'kea/**'
              - 'quadlet/**'
              - 'install.sh'
              - 'README.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -v
      - name: Containerfile linting
        uses: immanuwell/dockerfile-roast@1.4.4
        with:
          files: '**/Containerfile'
          engine: podman
          preset: production

  frontend:
    name: Frontend type-check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend

  publish:
    name: Publish container
    needs: [changes, test, frontend]
    # test/frontend are only skipped (not failed) when their own path filter
    # was false - that's fine, a real failure/cancellation still blocks
    # publish. Runs only if something that actually affects the built image
    # (backend or frontend) changed, so a docs-only push doesn't rebuild.
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      needs.test.result != 'failure' && needs.test.result != 'cancelled' &&
      needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Containerfile builds the Vue frontend in its own stage (see
      # docs/frontend.md, docs/deployment.md) - no separate frontend build
      # step needed here.
      # linux/arm64 covers 64-bit Raspberry Pi OS; QEMU (setup-qemu-action)
      # emulates it since this runner is amd64 - only the final stage runs
      # emulated, frontend-build is pinned to $BUILDPLATFORM (see Containerfile).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
