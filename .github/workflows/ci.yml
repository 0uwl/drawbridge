name: CI

on:
  push:
    # development is a testing stage before main - same test/publish
    # pipeline as main, just tagged by branch name instead of :latest (see
    # the publish job below). Add another branch here (and to publish's
    # if: below) for any further testing-stage branches.
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Anything under docs/ (or other pure-prose files) falls into neither
      # filter, so a docs-only PR skips test/frontend/publish entirely below.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'drawbridge/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'Containerfile'
              - 'Containerfile.rsyslog'
              - 'container/**'
              - 'kea/**'
              - 'quadlet/**'
              - 'install.sh'
              - 'uninstall.sh'
              - 'README.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches the two silently diverging - e.g. install.sh's default
      # DRAWBRIDGE_REF gets repointed at a release tag (see docs/decisions.md)
      # but README.md's plain one-liner doesn't, so it keeps installing
      # tip-of-main instead. Matches README.md's *default* one-liner only -
      # anchored on both the URL prefix and a bare `| bash` at end of line,
      # since the DRAWBRIDGE_REF=... example line right after it (a
      # deliberately different ref) also starts with `curl -fsSL https://...`
      # now that DRAWBRIDGE_REF correctly sits on bash's side of that pipe,
      # not curl's - see the two comments right above these one-liners in
      # README.md for why.
      - name: Verify README.md / install.sh default ref match
        run: |
          readme_ref=$(grep -oP '(?<=^curl -fsSL https://raw\.githubusercontent\.com/0uwl/drawbridge/)[^/]+(?=/install\.sh \| bash$)' README.md)
          installsh_ref=$(grep -oP '(?<=DRAWBRIDGE_REF:-)[^}]+' install.sh)
          if [ "$readme_ref" != "$installsh_ref" ]; then
            echo "README.md's default curl one-liner targets '$readme_ref' but install.sh's default DRAWBRIDGE_REF is '$installsh_ref' - update both together (see docs/decisions.md)." >&2
            exit 1
          fi
          echo "OK: both default to '$readme_ref'"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -v
      - name: Containerfile linting
        uses: immanuwell/dockerfile-roast@1.4.4
        with:
          files: '**/Containerfile'
          engine: podman
          preset: production
      # Separate step, not a broadened glob (e.g. '**/Containerfile*') -
      # that would also sweep in Containerfile.dev, which is deliberately
      # excluded from production-preset linting (see its own header comment
      # — dev/test image only, never used in production). A second literal
      # filename keeps that exclusion intact.
      - name: Containerfile.rsyslog linting
        uses: immanuwell/dockerfile-roast@1.4.4
        with:
          files: 'Containerfile.rsyslog'
          engine: podman
          preset: production
      - name: Kea config syntax check
        run: |
          sudo apt-get update
          # kea-ctrl-agent's package asks a debconf question on install (API
          # password) - see install.sh for the same preseed/noninteractive
          # handling and why "unconfigured" is the right answer here.
          echo "kea-ctrl-agent kea-ctrl-agent/make_a_choice select unconfigured" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kea-dhcp4-server kea-ctrl-agent
          # kea-dhcp4.conf's "interfaces" entry is a placeholder that isn't
          # meant to match any specific host (see install.sh, which resolves
          # it to a real NIC at install time) - swap in whatever interface
          # this runner has so -t checks syntax/semantics only, not an
          # unrelated "interface doesn't exist" mismatch.
          runner_iface=$(ip -o link show | awk -F': ' '$2 != "lo" {print $2; exit}')
          sudo install -d -m 755 /etc/kea
          sed "s/\"interfaces\": \[\"[^\"]*\"\]/\"interfaces\": [\"$runner_iface\"]/" kea/kea-dhcp4.conf | sudo tee /etc/kea/kea-dhcp4.conf >/dev/null
          sudo cp kea/kea-ctrl-agent.conf /etc/kea/kea-ctrl-agent.conf
          sudo kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
          sudo kea-ctrl-agent -t /etc/kea/kea-ctrl-agent.conf

  frontend:
    name: Frontend type-check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend

  publish:
    name: Publish container
    needs: [changes, test, frontend]
    # test/frontend are only skipped (not failed) when their own path filter
    # was false - that's fine, a real failure/cancellation still blocks
    # publish. Runs only if something that actually affects the built image
    # (backend or frontend) changed, so a docs-only push doesn't rebuild.
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      needs.test.result != 'failure' && needs.test.result != 'cancelled' &&
      needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main keeps :latest (existing pulls of that tag shouldn't change
      # meaning); every other allowed branch (development, and any future
      # testing-stage branch added to this workflow's `on.push.branches`
      # and the `if:` above) is tagged with its own branch name instead.
      # Tags by the branch actually pushed to, not whatever branch a merge
      # commit's content originally came from - GitHub's push event has no
      # record of the latter once it's merged.
      - name: Compute image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      # Containerfile builds the Vue frontend in its own stage (see
      # docs/frontend.md, docs/deployment.md) - no separate frontend build
      # step needed here.
      # linux/arm64 covers 64-bit Raspberry Pi OS; QEMU (setup-qemu-action)
      # emulates it since this runner is amd64 - only the final stage runs
      # emulated, frontend-build is pinned to $BUILDPLATFORM (see Containerfile).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
      # Sibling image for the pod's syslog collector (see docs/logging.md).
      # context stays repo root: its COPY container/rsyslog-drawbridge.conf
      # is a root-relative path, same as the main image's frontend/ COPY.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.rsyslog
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-rsyslog:${{ steps.tag.outputs.tag }}
